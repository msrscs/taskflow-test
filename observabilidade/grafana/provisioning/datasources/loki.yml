# Datasource Loki criado automaticamente na inicializacao do Grafana.
# "editable: false": ninguem altera pela interface; mudanca so por PR
# neste arquivo (o repositorio e a fonte da verdade - GitOps).
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
