# DAST - OWASP ZAP Baseline contra a TaskFlow rodando no proprio runner.
#
# Fluxo:
#   1. Builda a imagem a partir do Dockerfile da RAIZ (o mesmo que vai para
#      producao - nada de Dockerfile alternativo em outra pasta).
#   2. Sobe o container com segredos gerados na hora (nada hardcoded).
#   3. Espera ativamente o /login responder (sem isso o ZAP "ataca o nada"
#      e o relatorio sai falsamente limpo).
#   4. Roda o ZAP Baseline com as regras versionadas em .zap/rules.tsv.
#      fail_action: true = qualquer alerta WARN/FAIL que nao esteja
#      rebaixado (com justificativa) no rules.tsv reprova o job e bloqueia
#      o merge. Sem continue-on-error.
#   5. Publica o relatorio como artefato (feito pela propria action).

name: DAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: zap-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      IMAGE: taskflow:dast-${{ github.sha }}
      CONTAINER: taskflow-ci
      APP_URL: http://localhost:5000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build da imagem (Dockerfile da raiz)
        run: docker build -f Dockerfile -t "$IMAGE" .

      - name: Subir a TaskFlow em background
        run: |
          docker run -d --name "$CONTAINER" -p 5000:5000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -e TASKFLOW_SECRET_KEY="$(openssl rand -hex 32)" \
            -e TASKFLOW_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            -e FLASK_DEBUG=false \
            "$IMAGE"

      - name: Esperar a aplicacao responder em /login
        run: |
          for i in $(seq 1 30); do
            if curl -sSf "$APP_URL/login" > /dev/null; then
              echo "Aplicacao respondendo."
              exit 0
            fi
            echo "Aguardando a aplicacao subir... ($i/30)"
            sleep 2
          done
          echo "A aplicacao nao respondeu a tempo." >&2
          docker logs "$CONTAINER"
          exit 1

      - name: OWASP ZAP Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.APP_URL }}
          rules_file_name: .zap/rules.tsv
          # -a: inclui o AJAX spider na exploracao.
          cmd_options: "-a"
          # Gate: reprova o job se houver alerta nao justificado no rules.tsv.
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Logs da aplicacao (em caso de falha)
        if: failure()
        run: docker logs "$CONTAINER" || true

      - name: Encerrar o container
        if: always()
        run: docker rm -f "$CONTAINER" || true
