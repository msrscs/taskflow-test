# CI basico da TaskFlow (Modulo 1): instala as dependencias e roda o lint.
#
# Padronizacao aplicada (requisitos "Em todo o repositorio" do PDF):
#   - permissions: contents: read no topo (menor privilegio; o GITHUB_TOKEN
#     deste workflow so consegue LER o repositorio).
#   - Actions pinadas por SHA de commit, com a versao no comentario. Uma tag
#     (ex.: @v4) pode ser movida pelo dono da action para outro codigo; o SHA
#     e imutavel. O Dependabot (github-actions) atualiza SHA + comentario.
#   - Lint com ruff (o PDF pede ruff ou flake8) no lugar do py_compile, que
#     so checava sintaxe. Configuracao em pyproject.toml.
#
# O nome do job (build-e-lint) foi mantido: ele e o nome do required check
# na protecao da main. Se renomear, atualize a branch protection.

name: CI Basico - TaskFlow

on:
  # PR para a main: o gate que bloqueia o merge.
  pull_request:
    branches: [main]
  # Push na main: confirma o estado da main depois do merge.
  push:
    branches: [main]
  # Disparo manual pela aba Actions (ou: gh workflow run ci-basico.yml).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-e-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Mesma versao do Dockerfile (python:3.12-slim).
          python-version: "3.12"
          # Cache do pip baseado no requirements.txt: acelera reexecucoes.
          cache: pip

      - name: Instalar dependencias
        # requirements.txt tem hash de cada pacote (pip-compile): instalar
        # com --require-hashes confere a integridade, como no Dockerfile.
        # O ruff vai num pip install separado porque, com hashes, o pip
        # exige hash de TODO pacote da mesma chamada. Versao fixa: o
        # resultado do lint nao muda sozinho com regras novas.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install ruff==0.17.4

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatacao (ruff format --check)
        run: ruff format --check .
