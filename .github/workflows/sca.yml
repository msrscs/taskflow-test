# SCA (Software Composition Analysis) com pip-audit - Modulo 3.
#
# sast.yml cuida do NOSSO codigo; este workflow cuida do codigo de
# TERCEIROS (bibliotecas do requirements.txt). Qualquer CVE conhecida
# falha o job (gate). Novas versoes chegam via PRs do Dependabot.
#
# Padronizacao aplicada:
#   - permissions: contents: read no topo (menor privilegio).
#   - Actions pinadas por SHA, com a versao no comentario.
#   - Python 3.12 (antes 3.11), igual ao CI e ao Dockerfile: auditar com a
#     mesma versao usada em producao.
#   - pip-audit com versao fixa e --strict: falha tambem se alguma
#     dependencia nao puder ser auditada (antes ela seria pulada em silencio).
#   - Gatilhos: PR (o gate), push na main e manual.
#
# O nome do job foi mantido (e o nome do required check).

name: SCA - Auditoria de Dependencias

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar pip-audit (versao fixa)
        run: pip install pip-audit==2.10.1

      # O requirements.txt e gerado do requirements.in (pip-compile) e ja
      # lista as dependencias transitivas, que tambem sao auditadas.
      - name: Auditar requirements.txt
        # Exit code != 0 em qualquer CVE conhecida -> job vermelho.
        # Se um dia for preciso aceitar uma CVE sem correcao, use
        # --ignore-vuln <ID> COM justificativa no README.
        run: pip-audit -r requirements.txt --strict
