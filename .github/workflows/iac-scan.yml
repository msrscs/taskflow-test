# Scanning de IaC (Checkov + Trivy config) - Modulo 5.
#
# Padronizacao aplicada:
#   - REMOVIDO o filtro "paths: **/*.tf". Com ele, o workflow so rodava
#     quando um .tf mudava; marcado como required check, PRs que nao mexem
#     em infraestrutura ficariam travados esperando um check que nunca roda
#     (armadilha citada no PDF). Agora roda em todo PR: o scan leva poucos
#     segundos e garante que o check sempre exista.
#   - Checkov olha Terraform, Dockerfile e os proprios workflows
#     (github_actions), nao so Terraform: o Dockerfile tambem e IaC.
#   - Actions pinadas por SHA (antes @master, que executa qualquer commit
#     novo do repositorio da action) e versao do Trivy fixa.
#   - permissions: contents: read no topo; ubuntu-24.04 em todos os jobs.
#   - Nomes de job curtos e estaveis (checkov / trivy-config /
#     terraform-validate), que sao os required checks na protecao da main.
#
# Todo "#checkov:skip=CKV_...:<motivo>" e "#trivy:ignore" deve ficar no proprio recurso, com
# a justificativa escrita (exigencia do PDF).

name: IaC Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rodar Checkov
        uses: bridgecrewio/checkov-action@a32f8b5c5c7c958bc38947c65dfe139debaf0607 # v12.3140.0
        with:
          directory: .
          framework: terraform,dockerfile,github_actions
          # soft_fail: false -> exit code != 0 com achados (gate).
          soft_fail: false
          output_format: cli
          # Mostra so as checagens que falharam (log mais legivel).
          quiet: true

  trivy-config:
    name: trivy-config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O tfsec foi incorporado ao Trivy como "trivy config".
      - name: Rodar Trivy config (Terraform, Dockerfile, Compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          # Versao do binario do Trivy fixada (e o padrao desta action).
          version: v0.70.0
          # Gate so para severidades relevantes.
          severity: HIGH,CRITICAL
          exit-code: "1"

  # Exigencia do PDF: "terraform validate passando". Valida sintaxe, tipos e
  # referencias do infra/ sem credenciais AWS e sem criar nada
  # (-backend=false). fmt -check reprova codigo fora do padrao do Terraform.
  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Terraform (versao fixa)
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: terraform init (sem backend, provider conferido pelo lock)
        # -lockfile=readonly: falha se o provider baixado nao bater com o
        # hash registrado no .terraform.lock.hcl versionado.
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate
